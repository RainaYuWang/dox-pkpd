name: MATLAB Fig. 3 PK-PD
run-name: MATLAB Fig. 3 · ${{ inputs.mode || github.ref_name }}

on:
  push:
    branches: [pkpd-fig3-quick, pkpd-fig3-full]
    paths:
      - 'fig3/**'
      - 'ci/publish_results.py'
      - '.github/workflows/matlab-fig3.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Fig. 3 run mode
        type: choice
        options: [fig3-quick, fig3-full]
        default: fig3-quick

permissions:
  contents: read

concurrency:
  group: fig3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fit:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      PKPD_MODE: ${{ inputs.mode || (github.ref_name == 'pkpd-fig3-full' && 'fig3-full' || 'fig3-quick') }}
    steps:
      - uses: actions/checkout@v6
      - run: mkdir -p ci-logs
      - name: Publish running status
        continue-on-error: true
        run: python3 ci/publish_results.py --phase running --results-dir fig3_results
      - name: Install base MATLAB
        id: setup
        uses: matlab-actions/setup-matlab@v2
        timeout-minutes: 30
        with:
          release: R2024b
      - name: Fit and validate Fig. 3
        id: fit
        uses: matlab-actions/run-command@v2
        timeout-minutes: ${{ env.PKPD_MODE == 'fig3-quick' && 90 || 250 }}
        with:
          command: addpath('fig3'); run_fig3_pkpd('${{ env.PKPD_MODE }}')
          startup-options: -logfile ci-logs/matlab.log
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: pkpd-${{ env.PKPD_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fig3_results/
            ci-logs/
          if-no-files-found: warn
          retention-days: 30
      - name: Return results through Git
        if: ${{ always() }}
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          FIT_OUTCOME: ${{ steps.fit.outcome }}
        run: >-
          python3 ci/publish_results.py --phase finished --results-dir fig3_results
          --setup-outcome "$SETUP_OUTCOME" --fit-outcome "$FIT_OUTCOME"
