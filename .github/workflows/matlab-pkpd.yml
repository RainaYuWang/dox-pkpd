name: MATLAB PK-PD
run-name: MATLAB PK-PD ${{ inputs.mode || (github.ref_name == 'pkpd-dose-beta' && 'dose-beta' || (github.ref_name == 'pkpd-sensitivity' && 'sensitivity' || (github.ref_name == 'pkpd-full' && 'full' || 'quick'))) }} · ${{ github.ref_name }}

on:
  push:
    branches: [pkpd-cloud, pkpd-full, pkpd-sensitivity, pkpd-dose-beta]
    paths:
      - '**/*.m'
      - 'ci/*.py'
      - '.github/workflows/matlab-pkpd.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: quick validates the pipeline; full runs the default 8-start fit
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full
          - sensitivity
          - dose-beta

permissions:
  contents: read

concurrency:
  group: pkpd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fit:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Record run context
        env:
          MODE: ${{ inputs.mode || (github.ref_name == 'pkpd-dose-beta' && 'dose-beta' || (github.ref_name == 'pkpd-sensitivity' && 'sensitivity' || (github.ref_name == 'pkpd-full' && 'full' || 'quick'))) }}
        run: |
          mkdir -p ci-logs
          {
            date -u --iso-8601=seconds
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
            echo "mode=$MODE MATLAB=R2024b runner=ubuntu-22.04"
            echo "command=addpath('ci'); run_pkpd_ci('$MODE')"
            uname -a
          } | tee ci-logs/context.txt

      - name: Publish running status through Git
        continue-on-error: true
        run: python3 ci/publish_results.py --phase running

      - name: Set up base MATLAB R2024b
        id: setup
        uses: matlab-actions/setup-matlab@v2
        timeout-minutes: 30
        with:
          release: R2024b

      # Official public-project licensing: no Compiler/Coder or license secrets.
      - name: Run MATLAB fit and verify outputs
        id: fit
        uses: matlab-actions/run-command@v2
        timeout-minutes: ${{ (inputs.mode == 'full' || inputs.mode == 'sensitivity' || inputs.mode == 'dose-beta' || (github.event_name == 'push' && (github.ref_name == 'pkpd-full' || github.ref_name == 'pkpd-sensitivity' || github.ref_name == 'pkpd-dose-beta'))) && 240 || 60 }}
        with:
          command: addpath('ci'); run_pkpd_ci('${{ inputs.mode || (github.ref_name == 'pkpd-dose-beta' && 'dose-beta' || (github.ref_name == 'pkpd-sensitivity' && 'sensitivity' || (github.ref_name == 'pkpd-full' && 'full' || 'quick'))) }}')
          startup-options: -logfile ci-logs/matlab.log

      - name: Upload results and available logs (also on failure)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 10
        with:
          name: pkpd-${{ inputs.mode || (github.ref_name == 'pkpd-dose-beta' && 'dose-beta' || (github.ref_name == 'pkpd-sensitivity' && 'sensitivity' || (github.ref_name == 'pkpd-full' && 'full' || 'quick'))) }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            joint_results/
            ci-logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish results through Git (also on failure)
        if: ${{ always() }}
        timeout-minutes: 5
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          FIT_OUTCOME: ${{ steps.fit.outcome }}
        run: >-
          python3 ci/publish_results.py --phase finished
          --setup-outcome "$SETUP_OUTCOME" --fit-outcome "$FIT_OUTCOME"
